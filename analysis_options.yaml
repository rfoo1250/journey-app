include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - android/**
    - ios/**
  errors:
    invalid_annotation_target: ignore # freezed + json_serializable

linter:
  rules:
    # Internal app, not a published package: docs on every public member is noise.
    public_member_api_docs: false
